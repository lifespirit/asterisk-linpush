; Select exactly ONE of the following wake strategies for a route:
; 1. Legacy fixed delay: --wait 5 (always send FCM, wait 5s).
; 2. FCM + REGISTER: --wait-register 15 (always send FCM, wait for REGISTER).
; 3. Patched Asterisk 24: --wait-ready 15 --push-grace-ms 300
;    (fresh OPTIONS 2xx first; send FCM if no answer by 300ms).
; In each case PJSIP_DIAL_CONTACTS must be evaluated AFTER SHELL returns.
; See README.md (English) and README.ru.md (Russian).
;
; Example for chan_pjsip. Adjust context and endpoint IDs to your setup.
; IMPORTANT: FILTER() eliminates command injection through arbitrary extension data.
[linphone-users]
exten => _XXX,1,NoOp(Wake Linphone on ${EXTEN})
 same => n,Set(PUSH_RESULT=${SHELL(/usr/local/bin/linpush wake --number ${FILTER(0-9,${EXTEN})} --wait 5)})
 same => n,NoOp(Linphone push: ${PUSH_RESULT})
 same => n,Dial(${PJSIP_DIAL_CONTACTS(${EXTEN})},30)
 same => n,Hangup()

; If push is disabled or there are no devices, linpush returns immediately.
; SHELL() blocks the dialplan during the specified wait. 5 seconds is a starting point.
; If the phone re-registers and Asterisk contact is stale, adjust PJSIP routing.
; Do not pass unsanitized CALLERID(num), CALLERID(name), or SIP header values to SHELL().

; Ring group example: send push to all targets concurrently, wait ONCE,
; then resolve the updated PJSIP contacts and ring them simultaneously.
; Change 5:10:11 and the Dial() endpoints to match your actual dial group.
[linphone-ring-group]
exten => 500,1,NoOp(Wake ring group 5/10/11)
 same => n,Set(PUSH_RESULT=${SHELL(/usr/local/bin/linpush wake --numbers 5:10:11 --wait 5)})
 same => n,NoOp(Linphone group push: ${PUSH_RESULT})
 same => n,Dial(${PJSIP_DIAL_CONTACTS(5)}&${PJSIP_DIAL_CONTACTS(10)}&${PJSIP_DIAL_CONTACTS(11)},30)
 same => n,Hangup()

; To use a list stored in an Asterisk variable, sanitize it before SHELL():
; Set(PUSH_TARGETS=5:10:11)
; Set(PUSH_RESULT=${SHELL(/usr/local/bin/linpush wake --numbers ${FILTER(0-9:,${PUSH_TARGETS})} --wait 5)})
; The regex/validation in the Go service rejects invalid or excessive targets.

; Asterisk/chan_pjsip IVR. Include this context ONLY from your trusted
; internal SIP endpoints' dialplan, never from a public trunk context.
; The authenticated endpoint ID must equal its numeric extension.
; Example: include => linpush-ivr
; Put the generated linpush-*.wav in your Asterisk Russian sound directory
; (custom/) and set CHANNEL(language)=ru for these calls.
[linpush-ivr]
exten => *98,1,NoOp(Linpush IVR for authenticated endpoint)
 same => n,Set(LP_ENDPOINT=${CHANNEL(endpoint)})
 same => n,Set(LP_NUMBER=${FILTER(0-9,${LP_ENDPOINT})})
 same => n,GotoIf($[${LEN(${LP_NUMBER})} = 0]?denied)
 same => n,GotoIf($["${LP_ENDPOINT}" != "${LP_NUMBER}"]?denied)
 same => n,Answer()
 same => n,Set(CHANNEL(language)=ru)
 same => n(menu),Read(LP_ACTION,custom/linpush-menu,1,,2,8)
 same => n,GotoIf($["${LP_ACTION}" = "1"]?status)
 same => n,GotoIf($["${LP_ACTION}" = "2"]?enable)
 same => n,GotoIf($["${LP_ACTION}" = "3"]?disable)
 same => n,GotoIf($["${LP_ACTION}" = "0"]?finish)
 same => n,Playback(pbx-invalid)
 same => n,Goto(menu)
 same => n(status),Set(LP_RESULT=${TRIM(${SHELL(/usr/local/bin/linpush control status ${LP_NUMBER})})})
 same => n,Goto(result)
 same => n(enable),Set(LP_RESULT=${TRIM(${SHELL(/usr/local/bin/linpush control enable ${LP_NUMBER})})})
 same => n,Goto(result)
 same => n(disable),Set(LP_RESULT=${TRIM(${SHELL(/usr/local/bin/linpush control disable ${LP_NUMBER})})})
 same => n,Goto(result)
 same => n(result),GotoIf($["${LP_RESULT}" = "enabled"]?on)
 same => n,GotoIf($["${LP_RESULT}" = "disabled"]?off)
 same => n,Playback(custom/linpush-error)
 same => n,Goto(menu)
 same => n(on),Playback(custom/linpush-enabled)
 same => n,Goto(menu)
 same => n(off),Playback(custom/linpush-disabled)
 same => n,Goto(menu)
 same => n(denied),Answer()
 same => n,Playback(custom/linpush-denied)
 same => n,Hangup(21)
 same => n(finish),Playback(custom/linpush-goodbye)
 same => n,Hangup()
